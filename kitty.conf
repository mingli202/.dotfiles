# font
font_size 14
disable_ligatures always
modify_font cell_height 3px
text_composition_strategy 1.0 0

# titlebar
hide_window_decorations titlebar-only

# bg
background_opacity 0.9
background_blur 20

# other
window_padding_width 5
tab_bar_style powerline

# macos only
macos_option_as_alt both
macos_quit_when_last_window_closed yes
mouse_hide_wait -1
macos_show_window_title_in none

# theme
# include ~/dev/iTerm2-Color-Schemes/kitty/Catppuccin Mocha.conf
# include ~/dev/iTerm2-Color-Schemes/kitty/TokyoNight.conf
# include ~/dev/iTerm2-Color-Schemes/kitty/Gruvbox Material Dark.conf
include ~/dev/iTerm2-Color-Schemes/kitty/Gruvbox Dark.conf
# include ~/dev/iTerm2-Color-Schemes/kitty/Gruvbox Dark Hard.conf
# include ~/dev/iTerm2-Color-Schemes/kitty/Rose Pine.conf

# mappings
map cmd+shift+n new_os_window_with_cwd

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
